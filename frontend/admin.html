<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header>
    <h1>Admin Dashboard</h1>

    <nav>
        <a href="index.html">Home</a>
        <button id="logout-button">Logout</button>
    </nav>
</header>

<main>
    <h2>Restaurant Management</h2>

    <p id="admin-message"></p>
    <h3>Add Restaurant</h3>

    <form id="restaurant-form">

        <input
            type="text"
            id="restaurant-name"
            placeholder="Restaurant Name"
            required
        >

        <textarea
            id="restaurant-description"
            placeholder="Description"
        ></textarea>

        <input
            type="text"
            id="restaurant-address"
            placeholder="Address"
            required
        >

        <select id="restaurant-category" required>
            <option value="">Select Category</option>
        </select>

        <input
            type="number"
            id="restaurant-latitude"
            placeholder="Latitude"
            step="any"
        >

        <input
            type="number"
            id="restaurant-longitude"
            placeholder="Longitude"
            step="any"
        >

        <input
            type="text"
            id="restaurant-image"
            placeholder="Image path (optional)"
        >

        <button type="submit">Add Restaurant</button>
        <button type="button" id="cancel-restaurant-edit" hidden>
            Cancel
        </button>
    </form>

    <p id="restaurant-message"></p>

    <hr>
    <div id="admin-restaurants"></div>
    <hr>

    <section id="menu-management" hidden>

        <h2 id="menu-restaurant-name">Menu Management</h2>

        <form id="menu-form">
            <input
                type="text"
                id="menu-name"
                placeholder="Menu Name"
                required
            >

            <button type="submit">Add Menu</button>
            <button type="button" id="cancel-menu-edit" hidden>
                Cancel
            </button>
        </form>

        <p id="menu-message"></p>

        <div id="admin-menus"></div>
 
        

        <section id="item-management" hidden>

            <h3 id="item-menu-name">Menu Items</h3>

            <form id="item-form">

                <input
                    type="text"
                    id="item-name"
                    placeholder="Item Name"
                    required
                >

                <textarea
                    id="item-description"
                    placeholder="Description"
                ></textarea>

                <input
                    type="number"
                    id="item-price"
                    placeholder="Price"
                    min="0"
                    step="0.01"
                    required
                >

                <input
                    type="text"
                    id="item-image"
                    placeholder="Image path (optional)"
                >

                <button type="submit">Add Item</button>
                <button type="button" id="cancel-item-edit" hidden>
                    Cancel
                </button>
            </form>

            <p id="item-message"></p>

            <div id="admin-items"></div>

        </section>
    </section>
</main>

<script src="js/api.js"></script>
<script src="js/admin.js"></script>

</body>
</html>
