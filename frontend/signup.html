<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <h1>Restaurant App</h1>

        <nav>
            <a href="index.html">Home</a>
            <a href="login.html">Login</a>
        </nav>
    </header>

    <main>

        <h2>Create Account</h2>

        <form id="signup-form">

            <input
                type="text"
                id="first-name"
                placeholder="First Name"
                required
            >

            <input
                type="text"
                id="last-name"
                placeholder="Last Name"
                required
            >

            <input
                type="text"
                id="username"
                placeholder="Username"
                required
            >

            <input
                type="email"
                id="email"
                placeholder="Email"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Password"
                minlength="8"
                required
            >

            <button type="submit">
                Sign Up
            </button>

        </form>

        <p id="message"></p>

    </main>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>

</body>
</html>
